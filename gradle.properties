# Machine has ~7 GB RAM; keep the daemon modest.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1g
kotlin.code.style=official
android.useAndroidX=true

# Debug builds skip FLAG_SECURE so screenshots work during development (spec 17.7).
# Set to true to test secure-window behaviour in a debug build. Release always sets it.
safecopy.debugSecure=false
